<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — XRP · SOL · ETH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0d1210;
    --bg-panel: #131a17;
    --bg-panel-raised: #182019;
    --line: #26332c;
    --ink: #e9efe9;
    --ink-dim: #8ba396;
    --ink-faint: #5c7268;
    --up: #4fd68c;
    --down: #ef6f6f;
    --xrp: #4aa8ff;
    --sol-a: #a06bff;
    --sol-b: #34e0a1;
    --eth: #8fa3ff;
    --accent: #f2b544;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink); font-family:'Space Grotesk',sans-serif; min-height:100vh;}
  body{ -webkit-font-smoothing:antialiased; }
  .mono{font-family:'IBM Plex Mono',monospace;}

  a{color:inherit;}

  .wrap{max-width:1080px; margin:0 auto; padding:28px 20px 80px;}

  header.top{
    display:flex; align-items:baseline; justify-content:space-between;
    padding-bottom:22px; border-bottom:1px solid var(--line); margin-bottom:24px;
    flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{
    width:10px; height:10px; border-radius:2px; background:var(--accent);
    display:inline-block; transform:translateY(-1px);
  }
  header.top h1{font-size:1.35rem; font-weight:600; letter-spacing:-0.01em;}
  header.top .sub{color:var(--ink-faint); font-size:0.82rem;}

  nav.tabs{display:flex; gap:4px; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; padding:3px;}
  nav.tabs button{
    background:transparent; border:none; color:var(--ink-dim); font-family:inherit; font-size:0.82rem;
    padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:500; transition:background .15s, color .15s;
  }
  nav.tabs button.active{background:var(--bg-panel-raised); color:var(--ink);}
  nav.tabs button:hover:not(.active){color:var(--ink);}

  /* ---- coin cards ---- */
  .coin-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
  @media(max-width:760px){ .coin-grid{grid-template-columns:1fr;} }

  .coin-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:16px 16px 14px;
    cursor:pointer; transition:border-color .15s, transform .15s;
    border-top:2px solid var(--coin-color, var(--line));
  }
  .coin-card:hover{border-color:#3a4a41;}
  .coin-card.selected{background:var(--bg-panel-raised); border-color:var(--coin-color);}
  .coin-card .row1{display:flex; align-items:center; justify-content:space-between;}
  .coin-card .name{display:flex; align-items:center; gap:8px; font-weight:600; font-size:0.95rem;}
  .coin-card .dot{width:8px; height:8px; border-radius:50%; background:var(--coin-color);}
  .coin-card .ticker{color:var(--ink-faint); font-size:0.72rem;}
  .coin-card .price{font-family:'IBM Plex Mono',monospace; font-size:1.5rem; font-weight:600; margin-top:10px;}
  .coin-card .chg{font-family:'IBM Plex Mono',monospace; font-size:0.85rem; margin-top:4px; display:inline-flex; align-items:center; gap:4px;}
  .chg.up{color:var(--up);}
  .chg.down{color:var(--down);}

  /* ---- chart panel ---- */
  .panel{background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .panel-head .title{font-weight:600; font-size:1rem; display:flex; align-items:center; gap:8px;}
  .panel-head .title .dot{width:9px; height:9px; border-radius:50%;}

  .range-toggle{display:flex; gap:3px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:3px;}
  .range-toggle button{
    background:transparent; border:none; color:var(--ink-dim); font-family:'IBM Plex Mono',monospace; font-size:0.74rem;
    padding:6px 11px; border-radius:5px; cursor:pointer; transition:background .15s,color .15s;
  }
  .range-toggle button.active{background:var(--bg-panel-raised); color:var(--accent);}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  @media(max-width:640px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat{}
  .stat .label{font-size:0.68rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em;}
  .stat .val{font-family:'IBM Plex Mono',monospace; font-size:1.02rem; margin-top:3px; font-weight:500;}

  canvas{width:100%!important; height:280px!important;}
  .loading-note{color:var(--ink-faint); font-size:0.82rem; padding:40px 0; text-align:center;}

  /* ---- admin ---- */
  .admin-grid{display:grid; grid-template-columns:1.1fr 1.4fr; gap:16px;}
  @media(max-width:820px){ .admin-grid{grid-template-columns:1fr;} }

  form.entry{display:flex; flex-direction:column; gap:12px;}
  .field label{display:block; font-size:0.72rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .field select, .field input{
    width:100%; background:var(--bg); border:1px solid var(--line); border-radius:7px; color:var(--ink);
    padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:0.88rem;
  }
  .field select:focus, .field input:focus{outline:none; border-color:var(--accent);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  button.primary{
    background:var(--accent); color:#1a1300; border:none; border-radius:7px; padding:10px 14px;
    font-family:inherit; font-weight:600; font-size:0.88rem; cursor:pointer; margin-top:4px;
  }
  button.primary:hover{filter:brightness(1.08);}

  .summary-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;}
  @media(max-width:600px){ .summary-strip{grid-template-columns:1fr;} }
  .summary-strip .stat{background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px;}

  table.book{width:100%; border-collapse:collapse; font-size:0.83rem;}
  table.book th{
    text-align:left; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint);
    padding:0 8px 8px; font-weight:500; border-bottom:1px solid var(--line);
  }
  table.book td{padding:9px 8px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace;}
  table.book tr:last-child td{border-bottom:none;}
  table.book .coin-tag{font-family:'Space Grotesk',sans-serif; font-weight:600; display:flex; align-items:center; gap:6px;}
  table.book .coin-tag .dot{width:7px; height:7px; border-radius:50%;}
  .icon-btn{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:0.9rem; padding:2px 5px;}
  .icon-btn:hover{color:var(--down);}
  .empty-book{color:var(--ink-faint); font-size:0.85rem; padding:26px 0; text-align:center;}

  .hidden{display:none!important;}
  .err{color:var(--down); font-size:0.78rem; margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="mark"></span>
      <h1>Ledger</h1>
      <span class="sub">&nbsp;— live rates, positions &amp; P/L</span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="market">Market</button>
      <button class="tab-btn" data-tab="admin">Admin</button>
    </nav>
  </header>

  <!-- MARKET TAB -->
  <section id="tab-market">
    <div class="coin-grid" id="coinGrid"></div>

    <div class="panel">
      <div class="panel-head">
        <div class="title"><span class="dot" id="chartDot"></span><span id="chartTitle">Ethereum</span></div>
        <div class="range-toggle" id="rangeToggle">
          <button data-range="1h" class="active">1H</button>
          <button data-range="1d">1D</button>
          <button data-range="1w">1W</button>
          <button data-range="1y">1Y</button>
        </div>
      </div>
      <div id="chartArea"><canvas id="priceChart"></canvas></div>
      <div class="stat-row">
        <div class="stat"><div class="label">Period high</div><div class="val" id="statHigh">—</div></div>
        <div class="stat"><div class="label">Period low</div><div class="val" id="statLow">—</div></div>
        <div class="stat"><div class="label">Change</div><div class="val" id="statChange">—</div></div>
        <div class="stat"><div class="label">Trend</div><div class="val" id="statTrend">—</div></div>
      </div>
    </div>
    <div class="sub" style="color:var(--ink-faint); font-size:0.72rem;">Prices via CoinGecko. Updates on load and coin/range switch.</div>
  </section>

  <!-- ADMIN TAB -->
  <section id="tab-admin" class="hidden">
    <div class="summary-strip">
      <div class="stat"><div class="label">Total invested</div><div class="val" id="sumInvested">$0.00</div></div>
      <div class="stat"><div class="label">Current value</div><div class="val" id="sumValue">$0.00</div></div>
      <div class="stat"><div class="label">Profit / loss</div><div class="val" id="sumPL">$0.00</div></div>
    </div>

    <div class="admin-grid">
      <div class="panel">
        <div class="panel-head"><div class="title" id="formTitle">Log a position</div></div>
        <form class="entry" id="entryForm">
          <input type="hidden" id="editId" value="">
          <div class="field">
            <label>Coin</label>
            <select id="fCoin">
              <option value="ripple">XRP</option>
              <option value="solana">Solana</option>
              <option value="ethereum" selected>Ethereum</option>
            </select>
          </div>
          <div class="two-col">
            <div class="field">
              <label>Date deposited</label>
              <input type="date" id="fDate">
            </div>
            <div class="field">
              <label>Amount invested ($)</label>
              <input type="number" step="0.01" min="0" id="fUsd" placeholder="500.00">
            </div>
          </div>
          <div class="field">
            <label>Quantity received</label>
            <input type="number" step="any" min="0" id="fQty" placeholder="e.g. 0.85">
          </div>
          <div class="err hidden" id="formErr"></div>
          <button type="submit" class="primary" id="submitBtn">Add position</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-head"><div class="title">Positions</div></div>
        <div id="bookWrap"></div>
      </div>
    </div>
  </section>

</div>

<script>
const COINS = {
  ripple:   { label:'XRP',      ticker:'XRP',  color:'#4aa8ff' },
  solana:   { label:'Solana',   ticker:'SOL',  color:'#a06bff' },
  ethereum: { label:'Ethereum', ticker:'ETH',  color:'#8fa3ff' },
};
const RANGE_DAYS = { '1h':1, '1d':1, '1w':7, '1y':365 };

let liveData = {};      // { id: { usd, usd_24h_change } }
let selectedCoin = 'ethereum';
let selectedRange = '1h';
let chart = null;
let investments = [];

function fmtUsd(n, decimals){
  if (n === null || n === undefined || isNaN(n)) return '—';
  const d = decimals !== undefined ? decimals : (n < 1 ? 4 : 2);
  return '$' + n.toLocaleString(undefined, {minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtPct(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  const s = n >= 0 ? '+' : '';
  return s + n.toFixed(2) + '%';
}

async function fetchLivePrices(){
  const ids = Object.keys(COINS).join(',');
  const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
  const res = await fetch(url);
  liveData = await res.json();
}

function renderCoinGrid(){
  const grid = document.getElementById('coinGrid');
  grid.innerHTML = '';
  Object.keys(COINS).forEach(id => {
    const meta = COINS[id];
    const d = liveData[id] || {};
    const chg = d.usd_24h_change;
    const up = (chg || 0) >= 0;
    const card = document.createElement('div');
    card.className = 'coin-card' + (id === selectedCoin ? ' selected' : '');
    card.style.setProperty('--coin-color', meta.color);
    card.innerHTML = `
      <div class="row1">
        <div class="name"><span class="dot"></span>${meta.label}</div>
        <div class="ticker mono">${meta.ticker}</div>
      </div>
      <div class="price mono">${fmtUsd(d.usd)}</div>
      <div class="chg ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${fmtPct(chg)} <span style="color:var(--ink-faint); font-weight:400;">24h</span></div>
    `;
    card.addEventListener('click', () => { selectedCoin = id; renderCoinGrid(); loadChart(); });
    grid.appendChild(card);
  });
}

async function fetchChartData(coinId, range){
  const days = RANGE_DAYS[range];
  const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`;
  const res = await fetch(url);
  const json = await res.json();
  let prices = json.prices || [];
  if (range === '1h'){
    const cutoff = Date.now() - 60*60*1000;
    const recent = prices.filter(p => p[0] >= cutoff);
    prices = recent.length >= 2 ? recent : prices.slice(-12);
  }
  return prices;
}

function labelForRange(t, range){
  const d = new Date(t);
  if (range === '1h' || range === '1d') return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if (range === '1w') return d.toLocaleDateString([], {weekday:'short', hour:'2-digit'});
  return d.toLocaleDateString([], {month:'short', year:'2-digit'});
}

async function loadChart(){
  const meta = COINS[selectedCoin];
  document.getElementById('chartTitle').textContent = meta.label;
  document.getElementById('chartDot').style.background = meta.color;
  const area = document.getElementById('chartArea');
  area.innerHTML = '<div class="loading-note">Loading chart…</div>';

  let prices;
  try{
    prices = await fetchChartData(selectedCoin, selectedRange);
  }catch(e){
    area.innerHTML = '<div class="loading-note">Could not load chart data. Try again shortly.</div>';
    return;
  }
  area.innerHTML = '<canvas id="priceChart"></canvas>';
  const ctx = document.getElementById('priceChart').getContext('2d');

  const values = prices.map(p => p[1]);
  const labels = prices.map(p => labelForRange(p[0], selectedRange));
  const first = values[0], last = values[values.length - 1];
  const change = first ? ((last - first) / first) * 100 : 0;
  const high = Math.max(...values), low = Math.min(...values);
  const up = change >= 0;
  const lineColor = up ? '#4fd68c' : '#ef6f6f';

  if (chart) chart.destroy();
  const gradient = ctx.createLinearGradient(0,0,0,280);
  gradient.addColorStop(0, up ? 'rgba(79,214,140,0.25)' : 'rgba(239,111,111,0.22)');
  gradient.addColorStop(1, 'rgba(79,214,140,0)');

  chart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[{
      data: values, borderColor: lineColor, backgroundColor: gradient,
      borderWidth: 2, pointRadius: 0, fill:true, tension:0.25,
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#182019', borderColor:'#26332c', borderWidth:1, titleColor:'#8ba396', bodyColor:'#e9efe9',
        callbacks:{ label: (c) => fmtUsd(c.parsed.y) }
      }},
      scales:{
        x:{ grid:{display:false}, ticks:{ color:'#5c7268', maxTicksLimit:6, font:{family:"'IBM Plex Mono',monospace", size:10} } },
        y:{ grid:{color:'#1d2622'}, ticks:{ color:'#5c7268', font:{family:"'IBM Plex Mono',monospace", size:10}, callback:(v)=>fmtUsd(v,2) } }
      }
    }
  });

  document.getElementById('statHigh').textContent = fmtUsd(high);
  document.getElementById('statLow').textContent = fmtUsd(low);
  const changeEl = document.getElementById('statChange');
  changeEl.textContent = fmtPct(change);
  changeEl.style.color = up ? 'var(--up)' : 'var(--down)';
  const trendEl = document.getElementById('statTrend');
  trendEl.textContent = up ? '▲ Uptrend' : '▼ Downtrend';
  trendEl.style.color = up ? 'var(--up)' : 'var(--down)';
}

document.getElementById('rangeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-range]');
  if (!btn) return;
  document.querySelectorAll('#rangeToggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedRange = btn.dataset.range;
  loadChart();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tab-market').classList.toggle('hidden', tab !== 'market');
    document.getElementById('tab-admin').classList.toggle('hidden', tab !== 'admin');
    if (tab === 'admin') renderBook();
  });
});

/* ---------------- ADMIN ---------------- */

async function loadInvestments(){
  try{
    const res = await window.storage.get('investments', false);
    investments = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    investments = [];
  }
}
async function saveInvestments(){
  try{
    await window.storage.set('investments', JSON.stringify(investments), false);
  }catch(e){ console.error('Storage save failed', e); }
}

function uid(){ return 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

document.getElementById('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('formErr');
  errEl.classList.add('hidden');

  const coin = document.getElementById('fCoin').value;
  const date = document.getElementById('fDate').value;
  const usd = parseFloat(document.getElementById('fUsd').value);
  const qty = parseFloat(document.getElementById('fQty').value);
  const editId = document.getElementById('editId').value;

  if (!date || isNaN(usd) || usd <= 0 || isNaN(qty) || qty <= 0){
    errEl.textContent = 'Fill in a date, an invested amount, and a quantity greater than zero.';
    errEl.classList.remove('hidden');
    return;
  }

  if (editId){
    const idx = investments.findIndex(i => i.id === editId);
    if (idx > -1) investments[idx] = { ...investments[idx], coin, date, usd, qty };
  } else {
    investments.push({ id: uid(), coin, date, usd, qty });
  }
  await saveInvestments();
  resetForm();
  renderBook();
});

function resetForm(){
  document.getElementById('editId').value = '';
  document.getElementById('formTitle').textContent = 'Log a position';
  document.getElementById('submitBtn').textContent = 'Add position';
  document.getElementById('entryForm').reset();
}

function editEntry(id){
  const inv = investments.find(i => i.id === id);
  if (!inv) return;
  document.getElementById('editId').value = inv.id;
  document.getElementById('fCoin').value = inv.coin;
  document.getElementById('fDate').value = inv.date;
  document.getElementById('fUsd').value = inv.usd;
  document.getElementById('fQty').value = inv.qty;
  document.getElementById('formTitle').textContent = 'Edit position';
  document.getElementById('submitBtn').textContent = 'Save changes';
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteEntry(id){
  investments = investments.filter(i => i.id !== id);
  await saveInvestments();
  renderBook();
}

function renderBook(){
  const wrap = document.getElementById('bookWrap');
  let totalInvested = 0, totalValue = 0;

  if (!investments.length){
    wrap.innerHTML = '<div class="empty-book">No positions logged yet. Add one on the left.</div>';
  } else {
    let rows = '';
    investments.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(inv => {
      const meta = COINS[inv.coin];
      const price = (liveData[inv.coin] || {}).usd || 0;
      const value = inv.qty * price;
      const pl = value - inv.usd;
      const plPct = inv.usd ? (pl / inv.usd) * 100 : 0;
      totalInvested += inv.usd;
      totalValue += value;
      const up = pl >= 0;
      rows += `
        <tr>
          <td><span class="coin-tag"><span class="dot" style="background:${meta.color}"></span>${meta.ticker}</span></td>
          <td>${inv.date}</td>
          <td>${fmtUsd(inv.usd)}</td>
          <td>${inv.qty}</td>
          <td>${fmtUsd(value)}</td>
          <td style="color:${up ? 'var(--up)' : 'var(--down)'}">${up?'+':''}${fmtUsd(pl)} <span style="color:var(--ink-faint)">(${fmtPct(plPct)})</span></td>
          <td>
            <button class="icon-btn" title="Edit" onclick="editEntry('${inv.id}')">✎</button>
            <button class="icon-btn" title="Delete" onclick="deleteEntry('${inv.id}')">✕</button>
          </td>
        </tr>`;
    });
    wrap.innerHTML = `
      <table class="book">
        <thead><tr>
          <th>Coin</th><th>Deposited</th><th>Invested</th><th>Qty</th><th>Value now</th><th>P/L</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  const totalPL = totalValue - totalInvested;
  document.getElementById('sumInvested').textContent = fmtUsd(totalInvested);
  document.getElementById('sumValue').textContent = fmtUsd(totalValue);
  const plEl = document.getElementById('sumPL');
  plEl.textContent = (totalPL >= 0 ? '+' : '') + fmtUsd(totalPL);
  plEl.style.color = totalPL >= 0 ? 'var(--up)' : 'var(--down)';
}

/* expose for inline onclick handlers */
window.editEntry = editEntry;
window.deleteEntry = deleteEntry;

/* ---------------- INIT ---------------- */
async function init(){
  document.getElementById('fDate').valueAsDate = new Date();
  await loadInvestments();
  try{
    await fetchLivePrices();
  }catch(e){ console.error('Live price fetch failed', e); }
  renderCoinGrid();
  await loadChart();
  renderBook();
  // refresh live prices every 60s
  setInterval(async () => {
    try{ await fetchLivePrices(); renderCoinGrid(); renderBook(); }catch(e){}
  }, 60000);
}
init();
</script>
</body>
</html>
